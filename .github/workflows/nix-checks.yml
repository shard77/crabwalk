name: Nix checks

on:
  push:
    branches: ["main", "dev/*"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-checks.yml"
  pull_request:
    branches: ["main", "dev/*"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-checks.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31

      - name: Validate flake
        run: nix flake check --all-systems --no-build

      - name: Check Nix formatting
        run: nix develop --command nixfmt --check flake.nix
