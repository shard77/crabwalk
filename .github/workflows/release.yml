name: Release - Linux musl binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/nix-rust-build.yml

  conventional-commits:
    uses: ./.github/workflows/conventional-commits.yml

  nix:
    uses: ./.github/workflows/nix-checks.yml

  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml

  build:
    needs: [checks, conventional-commits, nix, workflow-lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          git merge-base --is-ancestor HEAD origin/main

      - name: Build and test static musl release with Nix
        run: nix build .#crabwalk --out-link result-musl --print-build-logs

      - name: Prepare release binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          binary="crabwalk-$RELEASE_TAG-$TARGET"
          mkdir -p dist
          cp result-musl/bin/crabwalk "dist/$binary"
          cd dist
          sha256sum "$binary" > "$binary.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: crabwalk-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          pattern: crabwalk-*
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        # Redirect only Cocogitto's output, after the Nix shell hook has run.
        run: |
          nix develop --command bash -s -- "$RELEASE_TAG" <<'SCRIPT'
          set -euo pipefail
          cog changelog --at "$1" --template full_hash > release-notes.md
          SCRIPT

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          cd ..
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file release-notes.md "${flags[@]}"
