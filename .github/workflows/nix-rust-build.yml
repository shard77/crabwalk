name: Rust checks

on:
  push:
    branches: ["main", "dev/*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "*rustfmt.toml"
      - "*clippy.toml"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "examples/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-rust-build.yml"
  pull_request:
    branches: ["main", "dev/*"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "*rustfmt.toml"
      - "*clippy.toml"
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "examples/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix-rust-build.yml"
  # Releases and manual runs always execute the full Rust suite.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31

      - name: Run rustfmt
        run: nix develop --command cargo fmt --all -- --check

      - name: Run linter
        run: nix develop --command cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests and doctests
        run: nix develop --command cargo test --locked --workspace --all-features

      - name: Generate documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: nix develop --command cargo doc --locked --workspace --all-features --no-deps --document-private-items
