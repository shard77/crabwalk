[package]
name = "crabwalk"
version = "0.1.0"
edition = "2024"
description = "A terminal app for triaging pull requests in rust-lang/rust."
authors = ["shard7 <sh7user@gmail.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/shard77/crabwalk"
# Required by the pinned ratatui-diff widget.
rust-version = "1.98"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[dependencies]
ratatui    = "0.30.2"
ratatui-diff = { git = "https://github.com/joshka/ratatui-diff", rev = "dc8765b9684195ef01495aab340c8dac0a7a98c8" }
crossterm  = { version = "0.29.0", features = ["event-stream"] }
# Avoid unused GitHub-App support and the native AWS-LC build.
octocrab   = { version = "0.54.9", default-features = false, features = ["default-client", "follow-redirect", "retry", "rustls", "rustls-ring"] }
tokio      = { version = "1.54.1", features = ["full"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml       = "1.1.8"
chrono     = { version = "0.4.45", features = ["serde"] }
anyhow     = "1.0.104"
arboard    = "3.7.0"
open       = "5.4.5"
pulldown-cmark = "0.13.6"
syntect        = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
keyring    = "4.2.0"
emojis = "0.9.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
